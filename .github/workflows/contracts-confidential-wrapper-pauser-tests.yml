# Run tests
name: contracts-confidential-wrapper-pauser-tests

on:
  pull_request:
    paths:
      - '.github/workflows/contracts-confidential-wrapper-pauser-tests.yml'
      - 'contracts/confidential-wrapper-pauser/**'
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

env:
  # Safe-chain enforces its own minimum-package-age check independently;
  # mirror the age (72 h) here so fresh, unvetted package versions are blocked.
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"

concurrency:
  group: ci-contracts-confidential-wrapper-pauser-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: contracts-confidential-wrapper-pauser-tests/tests (bpr)
    runs-on: ubuntu-latest
    permissions:
      contents: 'read' # Required to checkout repository code
    steps:
      # TODO: remove once GitHub runner images ship the CVE-2026-31431 kernel fix
      - name: Workaround CVE-2026-31431 (copy.fail)
        run: |
          echo "install algif_aead /bin/false" | sudo tee /etc/modprobe.d/disable-algif-aead.conf
          if lsmod | grep -q algif_aead; then
            sudo rmmod algif_aead || echo "WARNING: rmmod failed - module may be in use"
          elif modinfo algif_aead 2>/dev/null | grep -q builtin; then
            echo "WARNING: algif_aead built-in - modprobe.d blacklist has no effect"
          fi

      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: 'false'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/confidential-wrapper-pauser/package-lock.json

      - name: Install safe-chain (Aikido malicious-package guard)
        shell: bash
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.8/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        working-directory: contracts/confidential-wrapper-pauser
        run: npm ci

      - name: Lint
        working-directory: contracts/confidential-wrapper-pauser
        run: npm run lint

      - name: Run unit tests
        working-directory: contracts/confidential-wrapper-pauser
        run: make test

      - name: Run coverage
        working-directory: contracts/confidential-wrapper-pauser
        run: npm run coverage

      - name: Check coverage thresholds (core contract only)
        working-directory: contracts/confidential-wrapper-pauser
        run: npm run coverage:check

  fork-tests:
    name: contracts-confidential-wrapper-pauser-tests/fork-tests (bpr)
    # The live fork rehearsal needs an archive RPC secret, which GitHub provides on push to this
    # repository and on same-repo pull requests; fork PRs skip it cleanly.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    strategy:
      fail-fast: false
      matrix:
        network: [ethereum, sepolia]
    steps:
      # TODO: remove once GitHub runner images ship the CVE-2026-31431 kernel fix
      - name: Workaround CVE-2026-31431 (copy.fail)
        run: |
          echo "install algif_aead /bin/false" | sudo tee /etc/modprobe.d/disable-algif-aead.conf
          if lsmod | grep -q algif_aead; then
            sudo rmmod algif_aead || echo "WARNING: rmmod failed - module may be in use"
          elif modinfo algif_aead 2>/dev/null | grep -q builtin; then
            echo "WARNING: algif_aead built-in - modprobe.d blacklist has no effect"
          fi

      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: 'false'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.0

      - name: Install Foundry dependencies
        working-directory: contracts/confidential-wrapper-pauser/test/foundry
        run: make setup

      - name: Run build
        working-directory: contracts/confidential-wrapper-pauser/test/foundry
        run: make build

      - name: Run live fork rehearsal (${{ matrix.network }})
        working-directory: contracts/confidential-wrapper-pauser/test/foundry
        env:
          # Same archive-node secret as contracts-confidential-wrapper-foundry-tests; Sepolia falls back to
          # a public endpoint until a dedicated secret exists.
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_MAINNET_FORK_RPC_URL }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_FORK_RPC_URL || 'https://ethereum-sepolia-rpc.publicnode.com' }}
          # Passed through env rather than inlined in `run` so the matrix value is never
          # expanded into the shell script (zizmor template-injection).
          NETWORK: ${{ matrix.network }}
        run: make fork-test NETWORK="$NETWORK"
