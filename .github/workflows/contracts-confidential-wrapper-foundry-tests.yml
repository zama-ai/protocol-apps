# Run Foundry live mainnet-fork tests
name: contracts-confidential-wrapper-foundry-tests

# The fork suites upgrade the live proxies onto the candidate implementation, so they only have
# something to say when that implementation or the suites themselves change. Everything else in the
# wrapper package (Hardhat tests, tasks, deployments) is covered by its own workflow, and the registry
# is read from its live mainnet address rather than this repo's source.
on:
  pull_request:
    paths:
      - '.github/workflows/contracts-confidential-wrapper-foundry-tests.yml'
      - 'contracts/confidential-wrapper/contracts/**'
      - 'contracts/confidential-wrapper/test/foundry/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/contracts-confidential-wrapper-foundry-tests.yml'
      - 'contracts/confidential-wrapper/contracts/**'
      - 'contracts/confidential-wrapper/test/foundry/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-contracts-confidential-wrapper-foundry-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: contracts-confidential-wrapper-foundry-tests/tests (bpr)
    # The live archive-node run needs the RPC secret, which GitHub provides on push to
    # main, manual dispatch, and PRs from branches within this repo. Gate the whole job 
    # so fork PRs skip it cleanly (a maintainer pushes the branch to this repo to run it, 
    # matching security-analysis-gate.yml).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: 'read' # Required to checkout repository code
    steps:
      # TODO: remove once GitHub runner images ship the CVE-2026-31431 kernel fix
      - name: Workaround CVE-2026-31431 (copy.fail)
        run: |
          echo "install algif_aead /bin/false" | sudo tee /etc/modprobe.d/disable-algif-aead.conf
          if lsmod | grep -q algif_aead; then
            sudo rmmod algif_aead || echo "WARNING: rmmod failed - module may be in use"
          elif modinfo algif_aead 2>/dev/null | grep -q builtin; then
            echo "WARNING: algif_aead built-in - modprobe.d blacklist has no effect"
          fi

      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: 'false'
          submodules: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.3.1
          cache: false

      - name: Install Foundry dependencies
        working-directory: contracts/confidential-wrapper/test/foundry
        run: make setup

      - name: Run build
        working-directory: contracts/confidential-wrapper/test/foundry
        run: make build

      # The batcher suite drives the deployed bytecode at the addresses in config/batchers.json, so
      # a redeploy upstream would leave it testing dead contracts. Skips itself without a token.
      - name: Check batcher deployment manifest is current
        working-directory: contracts/confidential-wrapper/test/foundry
        env:
          GH_TOKEN: ${{ secrets.CONFIDENTIAL_DEFI_READ_TOKEN }}
        run: ./script/utils/check-batcher-manifest.sh

      - name: Run live fork tests against archive node
        working-directory: contracts/confidential-wrapper/test/foundry
        env:
          ETHEREUM_MAINNET_FORK_RPC_URL: ${{ secrets.ETHEREUM_MAINNET_FORK_RPC_URL }}
        run: make fork-test

      - name: Run live fork tests against the deployed batchers
        working-directory: contracts/confidential-wrapper/test/foundry
        env:
          ETHEREUM_MAINNET_FORK_RPC_URL: ${{ secrets.ETHEREUM_MAINNET_FORK_RPC_URL }}
        run: make fork-test-batcher
